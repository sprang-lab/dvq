[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dvq"
version = "0.1.0"
description = "DVQ: A community-extensible Python library for alignment-free visual, statistical, and spectral representation of nucleotide sequences"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "POT",
    "PyWavelets",
    "persim",
    "ripser",
    "Cython",
    "tqdm",
    "sourmash",
    "pytrf",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest"]
